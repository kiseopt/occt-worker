name: Release

on:
  push:
    tags:
      - "v*"

# actions: read is what lets this workflow find and download the candidate produced by
# the main CI run for this exact commit.
permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # No submodules and no npm ci: this workflow builds nothing. verify-candidate.mjs
      # uses only Node builtins, and npm publishes a prebuilt tarball by path.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify tag and package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $packageVersion"
          }
      # Exact-SHA lookup. Not "the newest artifact with the right name": the candidate
      # must come from a successful main push of the very commit this tag points at.
      - name: Locate release candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '${{ github.sha }}'
          $query = "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&event=push&branch=main"
          $runs = (& gh api $query | ConvertFrom-Json).workflow_runs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runs = @($runs | Where-Object { $_.head_sha -eq $sha -and $_.conclusion -eq 'success' })
          if ($runs.Count -eq 0) {
            throw "No successful main CI run found for $sha. A tag can only promote a commit that passed CI on main; push the commit to main first, or re-run CI for it."
          }
          $runId = ($runs | Sort-Object { [datetime]$_.created_at } -Descending)[0].id
          Write-Output "Promoting candidate from CI run $runId"
          "CANDIDATE_RUN_ID=$runId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download release candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & gh run download $env:CANDIDATE_RUN_ID --name "release-candidate-${{ github.sha }}" --dir release-candidate
          if ($LASTEXITCODE -ne 0) {
            throw "Candidate release-candidate-${{ github.sha }} could not be downloaded from run $env:CANDIDATE_RUN_ID. Artifacts expire after 30 days; re-run CI for this commit to rebuild the candidate."
          }
      - name: Verify release candidate
        shell: pwsh
        run: |
          node scripts/verify-candidate.mjs --dir release-candidate --tag ${{ github.ref_name }} --commit ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read candidate manifest
        shell: pwsh
        run: |
          $candidate = Get-Content -Raw release-candidate/candidate.json | ConvertFrom-Json
          "PACKAGE_TARBALL=$((Resolve-Path (Join-Path 'release-candidate' $candidate.npm.filename)).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_INTEGRITY=$($candidate.npm.integrity)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_VERSION=$($candidate.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # npm tags whatever it publishes as "latest" unless told otherwise, prerelease
          # versions included. A 1.3.1-rc.1 published without this would become the
          # default install for everyone running "npm i occt-worker".
          $isPrerelease = $candidate.version -match '-'
          "PACKAGE_DIST_TAG=$(if ($isPrerelease) { 'rc' } else { 'latest' })" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IS_PRERELEASE=$(if ($isPrerelease) { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Stage GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Get-Content -Raw release-candidate/candidate.json | ConvertFrom-Json
          # Everything the candidate recorded except the npm tarball, which goes to the
          # registry instead. candidate.json ships as provenance for the release.
          $assets = @(
            Get-ChildItem release-candidate -File |
              Where-Object { $_.Name -ne $candidate.npm.filename } |
              ForEach-Object { $_.FullName }
          )
          $releaseJson = & gh release view "${{ github.ref_name }}" --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @("${{ github.ref_name }}", '--draft', '--generate-notes')
            if ($env:IS_PRERELEASE -eq 'true') { $createArgs += '--prerelease' }
            & gh release create @createArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & gh release upload "${{ github.ref_name }}" @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish npm package
        shell: pwsh
        run: |
          & npm install --global npm@11.6.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $published = $null
          try {
            $published = Invoke-RestMethod -Uri "https://registry.npmjs.org/occt-worker/$env:PACKAGE_VERSION"
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          if ($null -eq $published) {
            & npm publish $env:PACKAGE_TARBALL --access public --provenance --ignore-scripts --tag $env:PACKAGE_DIST_TAG
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output "Published occt-worker@$env:PACKAGE_VERSION under dist-tag $env:PACKAGE_DIST_TAG"
          } elseif ($published.dist.integrity -ne $env:PACKAGE_INTEGRITY) {
            throw "npm package occt-worker@$env:PACKAGE_VERSION already exists with different contents; publish a new version"
          } else {
            Write-Output "npm package occt-worker@$env:PACKAGE_VERSION already matches this release"
          }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = & gh release view "${{ github.ref_name }}" --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($release.isDraft) {
            & gh release edit "${{ github.ref_name }}" --draft=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
